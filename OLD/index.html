<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>링크나무</title>
  <meta name="description" content="내 모든 링크를 한 페이지에" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #F4F7F2;
      --bg-accent: #E3EEDC;
      --surface: #FFFFFF;
      --surface-hover: #F9FBF7;
      --border: #DCE5D5;
      --text: #1F2A1C;
      --text-muted: #66735F;
      --accent: #3F8F4A;
      --accent-soft: rgba(63, 143, 74, 0.12);
      --shadow: 0 2px 10px rgba(31, 42, 28, 0.06);
    }

    :root[data-theme="dark"] {
      --bg: #121712;
      --bg-accent: #1A231A;
      --surface: #1C241C;
      --surface-hover: #232D23;
      --border: #2E3A2E;
      --text: #E8EFE5;
      --text-muted: #9AA894;
      --accent: #7BC47F;
      --accent-soft: rgba(123, 196, 127, 0.14);
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      padding: 48px 16px;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg-accent) 0%, var(--bg) 320px);
      background-color: var(--bg);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s, color 0.25s;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
    }

    /* 다크모드 토글 */
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.2s;
    }
    .theme-toggle:hover { transform: rotate(15deg); }
    .theme-toggle svg { width: 20px; height: 20px; }
    .theme-toggle .icon-sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

    /* 프로필 */
    .profile {
      text-align: center;
      margin-bottom: 32px;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--surface);
      box-shadow: 0 0 0 2px var(--accent), var(--shadow);
      margin-bottom: 16px;
      background: var(--accent-soft);
    }
    .name {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .bio {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* 링크 카드 */
    .links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .link-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s, background-color 0.15s, border-color 0.15s;
    }
    .link-card:hover {
      transform: translateY(-2px);
      background: var(--surface-hover);
      border-color: var(--accent);
    }
    .link-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .link-icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .link-icon svg { width: 20px; height: 20px; }
    .link-body {
      flex: 1;
      min-width: 0;
    }
    .link-title {
      display: block;
      font-weight: 600;
      font-size: 1rem;
    }
    .link-desc {
      display: block;
      color: var(--text-muted);
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .link-count {
      flex-shrink: 0;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
    }

    /* 하단 */
    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .footer button {
      margin-left: 8px;
      font: inherit;
      color: var(--accent);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
    }
    .brand {
      margin-top: 12px;
      font-weight: 600;
      color: var(--accent);
    }

    @media (max-width: 400px) {
      body { padding-top: 64px; }
      .link-desc { display: none; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="다크모드 전환">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <main class="container">
    <section class="profile">
      <img class="avatar" id="avatar" alt="프로필 사진" />
      <h1 class="name" id="name"></h1>
      <p class="bio" id="bio"></p>
    </section>

    <ul class="links" id="links"></ul>

    <footer class="footer">
      <span id="total"></span>
      <button type="button" id="reset">초기화</button>
      <p class="brand">🌳 링크나무</p>
    </footer>
  </main>

  <script>
    // ===== 여기만 수정하면 내 페이지가 됩니다 =====
    const profile = {
      name: "홍길동",
      bio: "웹 개발자 · 글 쓰는 사람 · 커피 애호가",
      // 비워두면 이름 첫 글자로 기본 이미지를 만듭니다
      photo: ""
    };

    const links = [
      { id: "github",    title: "GitHub",    desc: "github.com/honggildong",     url: "https://github.com/",    icon: "code" },
      { id: "blog",      title: "기술 블로그", desc: "개발하며 배운 것들을 기록합니다", url: "https://velog.io/",      icon: "pen" },
      { id: "instagram", title: "Instagram", desc: "@honggildong",               url: "https://instagram.com/", icon: "camera" },
      { id: "youtube",   title: "YouTube",   desc: "코딩 브이로그",                url: "https://youtube.com/",   icon: "play" },
      { id: "email",     title: "이메일",     desc: "hello@example.com",          url: "mailto:hello@example.com", icon: "mail" }
    ];
    // ==========================================

    const ICONS = {
      code:   '<path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>',
      pen:    '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
      camera: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.5"/>',
      play:   '<rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z"/>',
      mail:   '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
      link:   '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'
    };

    const COUNT_KEY = "linknamu:clicks";
    const THEME_KEY = "linknamu:theme";

    // localStorage가 막혀 있어도(사생활 보호 모드 등) 페이지는 정상 동작하도록 감쌉니다
    const storage = {
      get(key) { try { return localStorage.getItem(key); } catch { return null; } },
      set(key, value) { try { localStorage.setItem(key, value); } catch {} },
      remove(key) { try { localStorage.removeItem(key); } catch {} }
    };

    // ----- 클릭 수 -----
    function loadCounts() {
      try { return JSON.parse(storage.get(COUNT_KEY)) || {}; } catch { return {}; }
    }
    let counts = loadCounts();

    function saveCounts() {
      storage.set(COUNT_KEY, JSON.stringify(counts));
    }

    function renderTotal() {
      const total = links.reduce((sum, link) => sum + (counts[link.id] || 0), 0);
      document.getElementById("total").textContent = `총 클릭 ${total.toLocaleString()}회`;
    }

    // ----- 프로필 -----
    function defaultAvatar(name) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
        <rect width="96" height="96" fill="#3F8F4A"/>
        <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle"
          font-family="sans-serif" font-size="40" font-weight="700" fill="#fff">${name.charAt(0)}</text>
      </svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    function renderProfile() {
      document.getElementById("name").textContent = profile.name;
      document.getElementById("bio").textContent = profile.bio;
      document.getElementById("avatar").src = profile.photo || defaultAvatar(profile.name);
      document.title = `${profile.name} | 링크나무`;
    }

    // ----- 링크 카드 -----
    function renderLinks() {
      const list = document.getElementById("links");
      list.innerHTML = "";

      links.forEach(link => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.className = "link-card";
        a.href = link.url;
        if (!link.url.startsWith("mailto:")) {
          a.target = "_blank";
          a.rel = "noopener noreferrer";
        }
        a.innerHTML = `
          <span class="link-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">${ICONS[link.icon] || ICONS.link}</svg>
          </span>
          <span class="link-body">
            <span class="link-title"></span>
            <span class="link-desc"></span>
          </span>
          <span class="link-count"></span>`;
        a.querySelector(".link-title").textContent = link.title;
        const descEl = a.querySelector(".link-desc");
        if (link.desc) descEl.textContent = link.desc;
        else descEl.remove();

        const countEl = a.querySelector(".link-count");
        countEl.textContent = (counts[link.id] || 0).toLocaleString();
        countEl.title = "클릭 수";

        a.addEventListener("click", () => {
          counts[link.id] = (counts[link.id] || 0) + 1;
          saveCounts();
          countEl.textContent = counts[link.id].toLocaleString();
          renderTotal();
        });

        li.appendChild(a);
        list.appendChild(li);
      });

      renderTotal();
    }

    document.getElementById("reset").addEventListener("click", () => {
      if (!confirm("모든 링크의 클릭 수를 0으로 되돌릴까요?")) return;
      counts = {};
      storage.remove(COUNT_KEY);
      renderLinks();
    });

    // ----- 다크모드 -----
    // 저장된 설정이 없으면 운영체제 설정을 따릅니다
    function initTheme() {
      const saved = storage.get(THEME_KEY);
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      applyTheme(saved || (prefersDark ? "dark" : "light"));
    }

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      document.querySelector(".theme-toggle")
        .setAttribute("aria-label", theme === "dark" ? "밝은 화면으로 전환" : "어두운 화면으로 전환");
    }

    document.querySelector(".theme-toggle").addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      applyTheme(next);
      storage.set(THEME_KEY, next);
    });

    initTheme();
    renderProfile();
    renderLinks();
  </script>
</body>
</html>
